name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cycle:
    # Pinned: a floating runner image, Python or Node changes what the cycle
    # tests (reviewer E F11: a Python integer-conversion limit changed a verdict).
    runs-on: ubuntu-24.04
    steps:
      # Exact release tags. Replace with the release commit SHAs when the
      # workflow is next edited with network access; tags are mutable.
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12.8"
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.12.0"
      - run: python -m pip install -r requirements.txt
      # One full cycle: trace, both verifiers through run_vectors.py, worked
      # example, flip probe, fuzz, issuers. A stage that cannot run, or ran too
      # little, is VOID and fails the job. The seeds are fixed, so every CI run
      # repeats the same cases: CI is a regression check, not exploration. A new
      # cycle uses seeds that conformance/CYCLES.md does not list as spent.
      - run: python conformance/cycle.py --seeds 101,102,103 --n 3000
