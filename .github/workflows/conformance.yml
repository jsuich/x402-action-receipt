name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      # One full cycle: trace, both verifiers, worked example, flip probe, fuzz.
      # A stage that cannot run is VOID and fails the job.
      - run: python conformance/cycle.py --seeds 1,2,3 --n 3000
